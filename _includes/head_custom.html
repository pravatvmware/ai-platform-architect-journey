<!-- Mermaid.js Injection for Jekyll/Just-the-Docs -->
<script type="module">
  import mermaid from '[https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs](https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs)';
  
  // Initialize Mermaid
  mermaid.initialize({ startOnLoad: false, theme: 'default' });

  document.addEventListener("DOMContentLoaded", async function() {
    // Find all Jekyll-generated mermaid wrappers
    const mermaidBlocks = document.querySelectorAll('.language-mermaid');
    
    mermaidBlocks.forEach(function(block, index) {
      // Extract the raw diagram text
      const diagramText = block.textContent;
      
      // Create a clean div for Mermaid
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mermaid-diagram-' + index;
      div.textContent = diagramText;
      
      // Find the outermost wrapper that Jekyll created and replace it
      const wrapper = block.closest('div.highlighter-rouge') || block;
      wrapper.replaceWith(div);
    });

    // Tell Mermaid to render the new divs
    await mermaid.run({
      querySelector: '.mermaid'
    });
  });
</script>
