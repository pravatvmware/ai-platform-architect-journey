<!-- Mermaid.js Injection (v9 for Jekyll compatibility) -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    // 1. Configure Mermaid
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    
    // 2. Find all Jekyll Markdown mermaid code blocks
    var blocks = document.querySelectorAll('code.language-mermaid');
    
    blocks.forEach(function(block) {
      // 3. Create a raw div for the diagram
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = block.textContent;
      
      // 4. Rip out the Jekyll wrapper and insert the raw div
      var wrapper = block.closest('div.highlighter-rouge') || block.closest('pre');
      if (wrapper) {
         wrapper.parentNode.replaceChild(div, wrapper);
      }
    });
    
    // 5. Force the render
    mermaid.init(undefined, document.querySelectorAll('.mermaid'));
  });
</script>
